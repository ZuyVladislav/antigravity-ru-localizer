name: inspect checked draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing checked release tag
        required: true
      commit:
        description: Exact source commit
        required: true
      ci_run:
        description: Successful source CI run
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read checked draft metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          SOURCE_CI: ${{ inputs.ci_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI" > ci.json
          jq -e --arg commit "$SOURCE_COMMIT" '.head_sha == $commit and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/ci.yml"' ci.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '{id, tag_name, draft, prerelease, assets: [.assets[] | {name, size, digest}]}' > release-metadata.json
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true and .prerelease == false' release-metadata.json >/dev/null
          echo '### Checked draft metadata' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: checked-draft-metadata
          path: release-metadata.json
